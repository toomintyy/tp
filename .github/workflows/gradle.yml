name: Java CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Run repository-wide tests
        if: runner.os == 'Linux'
        working-directory:  ${{ github.workspace }}/.github
        run: ./run-checks.sh

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk+fx

      - name: Enable detailed test diagnostics
        shell: bash
        run: |
          cat > release-diagnostics.gradle <<'EOF'
          allprojects {
              tasks.withType(Test).configureEach {
                  testLogging {
                      exceptionFormat = 'full'
                      showStandardStreams = true
                  }
              }
          }
          EOF

      - name: Build and check with Gradle
        if: runner.os != 'Linux'
        run: ./gradlew --init-script release-diagnostics.gradle check coverage shadowJar

      - name: Build and check with Gradle using a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a ./gradlew --init-script release-diagnostics.gradle check coverage shadowJar

      - name: Save diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics-${{ runner.os }}
          path: |
            build/test-results/test
            build/reports/tests/test
            build/reports/small-window.png

      - name: Upload coverage reports to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
